<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cube timer</title>
        <style>
:root {
    --bg: #241b23;
    --bg-code: #362734;
    --text: #ede3ea;
    --accent: #a2c8a5;
}
  html, body {
      background: var(--bg);
      height: 100%;
      margin: 0;
      overflow: hidden;
  }
  body {
      color: var(--text);
      font-family: "JetBrains Mono", monospace;
      font-size: 16px;
      margin: 0 auto;
      padding: 1rem 1.25rem;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
  }
  h1, h2, h3, h4 { color: var(--accent); font-weight: 700; line-height: 1.3; }
  h1 { font-size: 2rem; margin: 0; }
  h3 { font-size: 1.2rem; margin: 0 0 0.5rem; }
  a { color: var(--accent); text-decoration: underline; }
  a:hover { background: var(--bg-code); }
  code { background: var(--bg-code); color: var(--accent); padding: 0.15em 0.45em; border-radius: 4px; }
  ul { margin: 0; padding-left: 0; list-style: none; }
  ::selection { background: var(--accent); color: var(--bg); }
  ::-moz-selection { background: var(--accent); color: var(--bg); }

  p.sub { color: var(--text); opacity: 0.6; margin: 0.25rem 0 0.5rem; }

  /* ↑ normal
     ↓ clock */
  .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      padding: 0.5rem 0 1rem;
      height: 40%;
  }
  .clock {
      font-size: clamp(3rem, 12vh, 6.5rem);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--accent);
      line-height: 1;
  }
  .clock.active { color: var(--text); }
  .hint { color: var(--text); opacity: 0.6; font-size: 0.85rem; margin-top: 0.5rem; }

  .columns {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 1.5rem;
      flex: 1 1 auto;
      min-height: 0;
  }
  .col { display: flex; flex-direction: column; min-height: 0; }
  .times-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
  .time-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.15rem 0;
      opacity: 0.85;
  }
  .time-row .del { background: none; border: none; color: var(--text); opacity: 0.6; cursor: pointer; font-family: inherit; padding: 0 0.3rem; }
  .time-row .del:hover { opacity: 1; color: var(--accent); }
  .actions { display: flex; gap: 1rem; padding-top: 0.4rem; }
  .actions button {
      background: none;
      border: none;
      color: var(--accent);
      text-decoration: underline;
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
      padding: 0;
  }
  .actions button:hover { opacity: 0.7; }

  .stat-row { display: flex; justify-content: space-between; padding: 0.15rem 0; }
  .stat-row span:first-child { opacity: 0.6; }

  #graph { width: 100%; flex: 1 1 auto; min-height: 0; }
        </style>
    </head>
    <body>

        <div class="stage">
            <div class="clock" id="clock">0:00.000</div>
            <div class="hint" id="hint">space to start</div>
        </div>

        <div class="columns">

            <section class="col">
                <h3>Times</h3>
                <ul class="times-list" id="timesList"></ul>
                <div class="actions">
                    <button id="btnExport">export</button>
                    <button id="btnImport">import</button>
                    <button id="btnClear">clear</button>
                    <input type="file" id="fileInput" accept=".txt,text/plain" style="display:none">
                </div>
            </section>

            <section class="col">
                <h3>Stats</h3>
                <div class="stat-row"><span>Best:</span><span id="statBest">—</span></div>
                <div class="stat-row"><span>Worst:</span><span id="statWorst">—</span></div>
                <div class="stat-row"><span>Average:</span><span id="statAvg">—</span></div>
                <div class="stat-row"><span>Median:</span><span id="statMedian">—</span></div>
                <div class="stat-row"><span>S Deviation:</span><span id="statDev">—</span></div>
                <div class="stat-row"><span>Avg 5:</span><span id="statAvg5">—</span></div>
                <div class="stat-row"><span>3 of 5:</span><span id="stat3of5">—</span></div>
                <div class="stat-row"><span>Best 3 of 5:</span><span id="statBest3of5">—</span></div>
                <div class="stat-row"><span>Avg 12:</span><span id="statAvg12">—</span></div>
                <div class="stat-row"><span>10 of 12:</span><span id="stat10of12">—</span></div>
                <div class="stat-row"><span>Best 10 of 12:</span><span id="statBest10of12">—</span></div>
            </section>

            <section class="col">
                <h3>Graph</h3>
                <canvas id="graph"></canvas>
            </section>

        </div>

        <script src="script.js"></script>
    </body>
</html>
